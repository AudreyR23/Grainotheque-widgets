<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Numérotation des variétés</title>
  <link rel="stylesheet" href="../styles/gestion_commun.css">
  <link rel="stylesheet" href="../styles/numerotation.css">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
  <header>
    <h1>Numérotation des variétés</h1>
    <span id="statut" class="statut"></span>
  </header>
  <main>
      <h2>Anomalie(s)</h2>
    <details id="bloc-analyse">
      <summary><span id="alerte-titre"></span><span>Détail de l'analyse (max, trous, doublons, invalides)</span></summary>      <div id="analyse"></div>
    </details>
    <section id="en-attente">
      <h2>Attribution(s) en attente</h2>
      <ul id="attentes"></ul>
      <button id="annuler-tout" type="button" class="btn">Tout annuler</button>
      <button id="sauvegarder" type="button" class="btn-principal">Enregistrer tout</button>
      <p id="message" class="message"></p>
    </section>

    <section id="attribution">
      <h2>Variétés sans numéro</h2>
      <p id="prochain" class="cadre-info"></p>
      <input id="recherche" type="search" class="champ" placeholder="Rechercher une variété…" autocomplete="off">
      <p id="compteur" class="info"></p>
      <ul id="liste" class="liste-choix"></ul>
    </section>
  </main>
  <script src="../script/numerotation.js"></script>
</body>
</html>
