<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semis à gérer</title>
<link rel="stylesheet" href="../styles/gestion_etiquettes.css">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
<header>
<h1>Sélection pour étiquettes <span id="compteurs" class="compteurs"></span></h1>
<span id="statut" class="statut">Chargement…</span>
</header>
<main>
<input id="recherche" type="search" placeholder="Filtrer par nom de variété…" autocomplete="off">    
<h3 id="titreSelection">À étiqueter</h3>
<ul id="listeSelection"></ul>
<div id="barreEnregistrement">
  <p id="messageSucces" class="succes" hidden></p>
  <p id="erreurEnregistrement" class="erreur" hidden></p>
  <button id="btnEnregistrer" type="button" class="btn-principal" hidden>Enregistrer tout</button>
</div>
<p id="message"></p>
</main>
<div id="confirmation" class="confirmation" hidden>
<div class="confirmation-boite">
<p id="confirmationTexte"></p>
<div class="confirmation-boutons">
<button id="confirmationNon" type="button" class="btn-annuler">Annuler</button>
<button id="confirmationOui" type="button" class="btn-valider">Valider</button>
</div>
</div>
</div>
<script src="../script/gestion_etiquettes.js"></script>
</body>
</html>
