<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sélection pour étiquettes</title>
<link rel="stylesheet" href="../../styles/gestion_commun.css">
<link rel="stylesheet" href="gestion_etiquettes.css">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
<header>
<h1>Sélection pour étiquettes</h1>
<span id="statut" class="statut">Chargement…</span>
</header>
<main>
<input id="recherche" class="champ" type="search" placeholder="Filtrer par nom de variété…" autocomplete="off">

<section id="enCours" hidden>
<h2 id="titreEnCours"></h2>
<ul id="listeEnCours" class="liste-brouillons"></ul>
<p id="erreurEnregistrement" class="erreur" hidden></p>
<button id="btnEnregistrer" type="button" class="btn btn-enregistrer btn-large">Enregistrer</button>
</section>

<h2 id="titreSelection">À étiqueter</h2>
<ul id="listeSelection" class="liste-semis"></ul>

<div id="barreFlottante">
<p id="messageSucces" class="succes" hidden></p>
<button id="btnVoirEnCours" type="button" class="btn btn-ajouter btn-large" hidden>Voir les « En cours »</button>
</div>
<p id="message"></p>
</main>
<div id="confirmation" class="confirmation" hidden>
<div class="confirmation-boite">
<p id="confirmationTexte"></p>
<div class="confirmation-boutons">
<button id="confirmationNon" type="button" class="btn-annuler">Annuler</button>
<button id="confirmationOui" type="button" class="btn-valider">Valider</button>
</div>
</div>
</div>
<script src="gestion_etiquettes.js"></script>
</body>
</html>
