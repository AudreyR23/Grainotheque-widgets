<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Numérotation des variétés</title>
  <link rel="stylesheet" href="../../styles/gestion_commun.css">
  <link rel="stylesheet" href="numerotation.css">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
  <header>
    <h1>Numérotation des variétés</h1>
    <span id="statut" class="statut"></span>
  </header>
  <main>
    <div id="anomalies" hidden>
      <label> Anomalies </label>
      <div id="anomalies-contenu" class="cadre-info-a-jour"></div>
    </div>

    <section id="fiche">
      <label> Prochain numéro à attribuer </label>
      <div class="pastilles">
        <span id="prochain" class="pastille"></span>
      </div>
<label for="recherche">Variété sans numéro</label>
<div class="champ-liste">
  <input id="recherche" type="search" class="champ" placeholder="Taper pour chercher…" autocomplete="off">
  <ul id="liste" class="liste-choix" hidden></ul>
</div>
    </section>

    <p id="message" class="info" hidden></p>

    <section id="en-attente" hidden>
      <h2 id="titre-attentes"></h2>
      <ul id="attentes" class="liste-brouillons"></ul>
      <button id="sauvegarder" type="button" class="btn btn-enregistrer btn-large">Enregistrer</button>
    </section>
  </main>
  <script src="numerotation.js"></script>
</body>
</html>
