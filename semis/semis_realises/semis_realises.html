<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semis réalisés</title>
  <link rel="stylesheet" href="../../styles/gestion_commun.css">
  <link rel="stylesheet" href="semis_realises.css">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
  <header>
    <h1>Semis réalisés</h1>
    <span id="statut" class="statut">Chargement…</span>
  </header>
    <main>
    <section id="fiche">
<div id="basculeMode" class="bascule">
  <button type="button" data-mode="godets" class="btn btn-large sousabri actif">Sous abri</button>
  <button type="button" data-mode="pleine_terre" class="btn btn-large pleineterre">Pleine terre</button>
</div>
      <label for="rechercheVariete">Variété</label>
      <div class="champ-liste">
        <input id="rechercheVariete" type="search" class="champ" placeholder="Taper pour chercher…" autocomplete="off">
        <ul id="listeVarietes" class="liste-choix" hidden></ul>
      </div>
      <div id="infoVariete" class="info" hidden></div>
      <div id="derniersSemis" class="cadre-info" hidden></div>
            <label for="selectMillesime">Millésime</label>
      <select id="selectMillesime" disabled></select>
          <label for="dateSemis">Date du semis</label>
      <input id="dateSemis" type="date" class="champ">

   <div class="deux-colonnes">
        <div id="blocGodets">
          <label for="nbGodets">Nb de godets</label>
          <input id="nbGodets" type="number" class="champ" min="1" step="1" inputmode="numeric">
        </div>
        <div>
          <label id="labelGraines" for="nbGraines">Graines par godet</label>
          <input id="nbGraines" type="number" class="champ" min="1" step="1" inputmode="numeric">
        </div>
      </div>

      <label for="selectType">Type</label>
      <select id="selectType" ></select>

            <div id="blocOu" hidden>
        <label for="rechercheOu">Où</label>
        <div id="pastillesOu" class="pastilles"></div>
        <div class="champ-liste">
          <input id="rechercheOu" type="search" class="champ" placeholder="Chercher un emplacement…" autocomplete="off">
          <ul id="listeOu" class="liste-choix" hidden></ul>
        </div>
      </div>
            <label class="case"><input id="caseSachetVide" type="checkbox"> Sachet vidé (millésime épuisé)</label>
            <label class="case"><input id="caseAProduire" type="checkbox"> À reproduire (produire des graines)</label>
            <p id="erreurFiche" class="erreur" hidden></p>
            <button id="btnAjouter" type="button" class="btn btn-ajouter btn-large">Ajouter à la liste</button>    
    </section>
        <p id="messageSucces" class="succes" hidden></p>
        <section id="etapeintermediaires">
      <h2 id="titreetapeintermediaires" hidden></h2>
      <ul id="listeetapeintermediaires" class="liste-etape-intermediaires"></ul>
            <p id="erreurEnregistrement" class="erreur" hidden></p>
            <button id="btnEnregistrer" type="button" class="btn btn-enregistrer btn-large " hidden >Enregistrer</button>    </section>
  </main>
  <script src="semis_realises.js"></script>
</body>
</html>
