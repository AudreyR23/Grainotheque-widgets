<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles/plan.css">
</head>
<body>

<div class="toolbar">
  <span class="mode-badge mode-view" id="mode-badge">VUE</span>
  <div class="sep"></div>
  <button class="btn btn-edit"    onclick="setMode('edit')" title="Déplacer et pivoter les zones">✏️ Éditer zones</button>
  <button class="btn btn-lock"    onclick="setMode('plant')" title="Placer les plantes">🌱 Placer plantes</button>
  <button class="btn btn-select"  onclick="setMode('select')" title="Sélectionner une surface et la déplacer">⬚ Sélection</button>
  <button class="btn"             onclick="setMode('view')" title="Vue normale">👁 Vue</button>
  <div class="sep"></div>
  <button class="btn btn-primary" onclick="sauvegarder()">💾 Sauvegarder</button>
  <button class="btn" onclick="resetPlantes()">↩ Réinit. plantes</button>
  <div class="sep"></div>
  <button class="btn" onclick="zoomIn()">🔍+</button>
  <button class="btn" onclick="zoomOut()">🔍−</button>
  <button class="btn" onclick="zoomReset()">⊡</button>
  <div class="sep"></div>
<label class="taille-etiq" title="Taille des étiquettes">🏷️
  <input type="range" id="taille-etiq" min="50" max="150" step="5" value="100"
         oninput="changerTaille(this.value)" onchange="sauverTaille(this.value)">
</label>
  <div class="sep"></div>
  <button class="btn" id="btn-tablette" onclick="changerModeTablette()" title="Interface tactile">🖐 Auto</button>
  <button class="btn" onclick="toggleCoupures()">✂️ Coupures A3</button>
  <button class="btn" onclick="imprimerA3()">🖨️ Imprimer A3</button>
  <span class="status" id="status">Chargement…</span>
</div>

<div class="app">
  <!-- Panel gauche -->
  <div class="panel" id="panel">
    <div class="panel-title">🪏 Plan</div>
    <div class="panel-zone-label" id="zone-label">Cliquer sur une zone</div>
    <div class="panel-filter">
      <input type="text" id="search" placeholder="🔍 Rechercher…" oninput="renderPanel()">
    </div>
    <div class="panel-list" id="panel-list"></div>
  </div>

  <!-- Plan -->
  <div class="plan-wrap">
    <div class="plan-viewport" id="viewport">
      <svg id="plan" width="2000" height="1600">
        <defs>
          <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
            <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#e8e0d5" stroke-width="0.5"/>
          </pattern>
        </defs>
        <!-- Zones générées par JS -->
        <g id="zones-layer"></g>
        <g id="cuts-layer"></g>
        <!-- Étiquettes plantes -->
        <g id="plants-layer"></g>
        <g id="names-layer" pointer-events="none"></g>
        <g id="selection-layer"></g>
      </svg>
    </div>
  </div>
</div>

<div id="print-root"></div>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="../script/plan.js"></script>
</body>
</html>
