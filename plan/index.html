<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Arial, sans-serif;
  background: #f0ebe3;
  color: #2c2a27;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.toolbar {
  background: #fff8f0;
  border-bottom: 1px solid #d4c5b0;
  padding: 6px 10px;
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 11px;
  flex-shrink: 0;
}
.btn {
  padding: 4px 10px;
  border: 1px solid #d4c5b0;
  border-radius: 4px;
  background: white;
  cursor: pointer;
  font-size: 11px;
}
.btn:hover { background: #f0ebe3; }
.btn-primary { background: #2d6a4f; color: white; border-color: #2d6a4f; }
.btn-primary:hover { background: #1f4f38; }
.status { color: #666; flex: 1; }

.app {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Panel gauche */
.panel {
  width: 190px;
  min-width: 190px;
  background: #fff8f0;
  border-right: 2px solid #d4c5b0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-title {
  background: #2d6a4f;
  color: white;
  font-size: 11px;
  font-weight: bold;
  padding: 6px 8px;
  text-transform: uppercase;
}
.panel-zone-label {
  background: #e8f5e9;
  color: #2d6a4f;
  font-size: 10px;
  font-weight: bold;
  padding: 4px 8px;
  border-bottom: 1px solid #c8e6c9;
}
.panel-filter {
  padding: 5px 6px;
  border-bottom: 1px solid #e0d8cc;
}
.panel-filter input {
  width: 100%;
  padding: 3px 5px;
  border: 1px solid #d4c5b0;
  border-radius: 4px;
  font-size: 10px;
}
.panel-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.etiquette-item {
  background: #e8f5e9;
  border: 1px solid #a5d6a7;
  border-radius: 5px;
  padding: 4px 6px;
  cursor: grab;
  font-size: 10px;
  line-height: 1.3;
  user-select: none;
}
.etiquette-item:hover { background: #c8e6c9; }
.etiquette-item.placed { background: #f5f5f5; border-color: #ddd; color: #aaa; cursor: default; opacity: 0.6; }
.etiquette-item .nom { font-weight: bold; }
.etiquette-item .variete { font-style: italic; color: #555; font-size: 9px; }
.etiquette-item .ou { font-size: 9px; color: #2d6a4f; }

/* Plan */
.plan-container {
  flex: 1;
  overflow: auto;
  padding: 12px;
  background: #f0ebe3;
}

svg#plan {
  background: #faf8f4;
  border-radius: 6px;
  border: 1px solid #d4c5b0;
  display: block;
}

.zone-g { cursor: pointer; }
.zone-g:hover > * { opacity: 0.8; }
.zone-g.active > rect,
.zone-g.active > ellipse,
.zone-g.active > polygon,
.zone-g.active > path,
.zone-g.active > circle { stroke: #2d6a4f !important; stroke-width: 3 !important; }

.placed-tag { cursor: move; }
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn btn-primary" onclick="sauvegarder()">💾 Sauvegarder</button>
  <button class="btn" onclick="resetPositions()">↩ Réinitialiser</button>
  <button class="btn" onclick="zoneActive=null; renderPanel()">🌿 Tout afficher</button>
  <span class="status" id="status">Chargement...</span>
</div>

<div class="app">
  <div class="panel">
    <div class="panel-title">🌱 Plantes à placer</div>
    <div class="panel-zone-label" id="zone-label">Cliquer sur une zone</div>
    <div class="panel-filter">
      <input type="text" id="search" placeholder="Rechercher..." oninput="renderPanel()">
    </div>
    <div class="panel-list" id="panel-list"></div>
  </div>

  <div class="plan-container">
    <!-- 
      ÉCHELLE : 1cm = 1.3px (ajustée pour tenir dans ~900px de large)
      Les zones sont positionnées approximativement, pas géographiquement exactes
      sauf Ext.Serre qui entoure la Serre
    -->

         ondragover="event.preventDefault()"
         ondrop="dropOnPlan(event)">

      <text x="10" y="14" font-size="10" fill="#999" font-family="Arial">
        Cliquer sur une zone pour filtrer les plantes · Glisser-déposer pour placer

      <!-- =======================================
           SERRE (300×400cm → 234×312px)
           + EXT SERRE (bande 40cm = 31px autour sur 3 côtés S/E/W)
           ======================================= -->

      <!-- Ext. Serre (bande autour de 3 côtés) -->

         ondragover="event.preventDefault()"
         ondrop="dropOnZone(event,'Ext. Serre')">
        <!-- Bande S -->
        <rect x="59" y="343" width="234" height="31" fill="#b2dfdb" stroke="#00796b" stroke-width="1.5" opacity="0.8"/>
        <!-- Bande E -->
        <rect x="293" y="30" width="31" height="313" fill="#b2dfdb" stroke="#00796b" stroke-width="1.5" opacity="0.8"/>
        <!-- Bande W -->
        <rect x="28" y="30" width="31" height="313" fill="#b2dfdb" stroke="#00796b" stroke-width="1.5" opacity="0.8"/>
        <text x="303" y="100" font-size="8" fill="#004d40" font-family="Arial" font-weight="bold" transform="rotate(90,303,100)">Ext. Serre E</text>
        <text x="42" y="190" font-size="8" fill="#004d40" font-family="Arial" writing-mode="tb">Ext. Serre W</text>
        <text x="100" y="368" font-size="8" fill="#004d40" font-family="Arial">Ext. Serre S</text>
      </g>

      <!-- Ext. Serre Clôture (400×50cm → 312×39px) - bande au nord -->

         ondragover="event.preventDefault()"
         ondrop="dropOnZone(event,'Ext. Serre Clô.')">
        <rect x="59" y="22" width="234" height="39" fill="#a5d6a7" stroke="#388e3c" stroke-width="1.5"/>
        <text x="90" y="36" font-size="8" fill="#1b5e20" font-family="Arial" font-weight="bold">Ext. Serre Clô.</text>
      </g>

      <!-- Ext. Serre Bulle (160×80cm → 125×62px) -->

         ondragover="event.preventDefault()"
         ondrop="dropOnZone(event,'Ext. Serre Bulle')">

      <!-- Serre principale (300×400cm → 234×312px) -->

        <!-- labels -->
        <text x="357" y="522" font-size="7" fill="#bbb" font-family="Arial">1-1</text>
        <text x="425" y="522" font-size="7" fill="#bbb" font-family="Arial">2-1</text>
        <text x="493" y="522" font-size="7" fill="#bbb" font-family="Arial">3-1</text>
        <text x="561" y="522" font-size="7" fill="#bbb" font-family="Arial">4-1</text>

        <text x="425" y="590" font-size="7" fill="#bbb" font-family="Arial">2-2</text>
        <text x="493" y="590" font-size="7" fill="#bbb" font-family="Arial">3-2</text>
        <text x="561" y="590" font-size="7" fill="#bbb" font-family="Arial">4-2</text>

      <!-- =======================================

           FIGUIER (cercle 60cm → r=23px)
           ======================================= -->
      <g class="zone-g" id="z-figuier" onclick="selectZone('Fig.J')"
         ondragover="event.preventDefault()"
         ondrop="dropOnZone(event,'Fig.J')">
        <circle cx="780" cy="600" r="23" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5"/>
        <text x="757" y="604" font-size="8" fill="#1b5e20" font-family="Arial" font-weight="bold">Figuier</text>
      </g>

      <!-- =======================================
           MURIER (ovale 230×400cm → 180×312px)
           ======================================= -->
      <g class="zone-g" id="z-murier" onclick="selectZone('Murier')"
         ondragover="event.preventDefault()"
         ondrop="dropOnZone(event,'Murier')">
        <ellipse cx="780" cy="720" rx="90" ry="47" fill="#ce93d8" stroke="#6a1b9a" stroke-width="1.5"/>
        <text x="745" y="724" font-size="8" fill="#4a148c" font-family="Arial" font-weight="bold">Murier / Prairie</text>
      </g>

      <!-- =======================================
           TIPI CARRÉ (40×40cm → 31×31px)
           ======================================= -->
      <g class="zone-g" id="z-tipi-carre" onclick="selectZone('Tipi carré')"
         ondragover="event.preventDefault()"
         ondrop="dropOnZone(event,'Tipi carré')">
        <rect x="628" y="373" width="31" height="31" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
        <text x="630" y="385" font-size="7" fill="#e65100" font-family="Arial" font-weight="bold">Tipi</text>
        <text x="630" y="397" font-size="7" fill="#e65100" font-family="Arial">carré</text>
      </g>

      <!-- =======================================
           FONTAINE (200×100cm → 156×78px)
           ======================================= -->
      <g class="zone-g" id="z-fontaine" onclick="selectZone('Fontaine')"
         ondragover="event.preventDefault()"
         ondrop="dropOnZone(event,'Fontaine')">
        <rect x="348" y="760" width="156" height="47" fill="#80deea" stroke="#00838f" stroke-width="1.5"/>
        <text x="395" y="782" font-size="9" fill="#006064" font-family="Arial" font-weight="bold">Fontaine</text>
      </g>

      <!-- Conteneur étiquettes placées -->
      <g id="placed-tags"></g>

    </svg>
  </div>
</div>

<script>
/* =============================================
   CORRESPONDANCE Zone SVG → valeurs Ou dans Semis
   ============================================= */
const ZONE_MAP = {
  'Serre':         ['Serre','SerreN','SerreS','SerreE','SerreW','Serre Tipi'],
  'Ext. Serre':    ['Ext. Serre N','Ext. Serre S','Ext. Serre E','Ext. Serre W'],
  'Ext. Serre Clô.': ['Ext. Serre Clô.'],
  'Ext. Serre Bulle': ['Ext. Serre Bulle'],
  'Ext. Serre Tipi':  ['Ext. Serre Tipi'],
  'Pot.HN':        ['Pot.HN'],
  'Potager':       ['Pot.Bulle','Pot.HE','Pot.HC','Pot. X-Y'],
  'Pot.Bulle':     ['Pot.Bulle'],
  'Pot.HE':        ['Pot.HE'],
  'Pot.HC':        ['Pot.HC'],
  'Pot.X-Y':       ['Pot.1-1','Pot.1-2','Pot.1-3','Pot.1-4',
                    'Pot.2-1','Pot.2-2','Pot.2-3','Pot.2-4',
                    'Pot.3-1','Pot.3-2','Pot.3-3','Pot.3-4',
                    'Pot.4-1','Pot.4-2','Pot.4-3','Pot.4-4',
                    'Pot. 1-1'],
  'Potager Bas':   ['Pot.B','Pot.BC'],
  'Pot.Table':     ['Pot.Table'],
  'Pot.Prunier':   ['Pot.Prunier'],
  'Bac C angle':   ['Bac C angle'],
  'Bac R milieu':  ['Bac R milieu'],
  'Bac C milieu':  ['Bac C milieu'],
  'Bac R angle':   ['Bac R angle'],
  'Bac terrasse':  ['Bac terrasse'],
  'Grand bac':     ['Grand bac'],
  'Cour':          ['Cour 1','Cour 2','C. Fosse','C. Terrasse'],
  'Fosse':         ['C. Fosse','C. Terrasse'],
  'Regard eau':    ['Regard eau'],
  'Séchoir H':     ['Séchoir H','Séchoir HB'],
  'Séchoir B':     ['Séchoir B','Séchoir HB'],
  'Murette':       ['Murette'],
  'Fig.J':         ['Fig.J','Figuier'],
  'Murier':        ['Murier','Prairie murier'],
  'Tipi carré':    ['Tipi carré'],
  'Fontaine':      ['Fontaine'],
};

/* =============================================
   ÉTAT
   ============================================= */
let records     = [];
let positions   = {};
let zoneActive  = null;
let draggedId   = null;
let dragOffsetX = 0;
let dragOffsetY = 0;
let isDraggingPlaced = false;

/* =============================================
   GRIST
   ============================================= */
grist.ready({ requiredAccess: 'full' });

grist.onRecords(function(recs) {
  records = recs.filter(r => (r.Plantes > 0) || r.A_produire);
  records.forEach(r => {
    if (r.Position_X && r.Position_Y) {
      positions[r.id] = { x: r.Position_X, y: r.Position_Y };
    }
  });
  document.getElementById('status').textContent = records.length + ' plantes';
  renderPanel();
  renderPlacedTags();
});

/* =============================================
   SÉLECTION DE ZONE
   ============================================= */
function selectZone(zoneName) {
  zoneActive = zoneName;
  document.getElementById('zone-label').textContent = '📍 ' + zoneName;
  document.querySelectorAll('.zone-g').forEach(g => g.classList.remove('active'));
  // Activer toutes les zones ayant ce nom
  document.querySelectorAll(`[onclick*="${zoneName}"]`).forEach(g => g.classList.add('active'));
  renderPanel();
}

/* =============================================
   PANEL — liste filtrée
   ============================================= */
function renderPanel() {
  const list   = document.getElementById('panel-list');
  const search = (document.getElementById('search').value || '').toLowerCase();

  // Valeurs Ou acceptées pour la zone active
  const ouAcceptes = zoneActive ? (ZONE_MAP[zoneActive] || [zoneActive]) : null;

  const filtered = records.filter(r => {
    const nom = ((r.Nom || '') + ' ' + (r.Variete || '')).toLowerCase();
    if (!nom.includes(search)) return false;
    if (!ouAcceptes) return true;
    // Vérifier si Ou contient une des valeurs acceptées
    const ouVals = Array.isArray(r.Ou) ? r.Ou : (r.Ou ? [r.Ou] : []);
    return ouVals.some(v => ouAcceptes.includes(v));
  });

  list.innerHTML = '';
  if (filtered.length === 0) {
    list.innerHTML = '<div style="color:#aaa;font-size:10px;padding:8px;text-align:center">Aucune plante pour cette zone</div>';
    return;
  }

  filtered.forEach(r => {
    const placed = positions[r.id] !== undefined;
    const div = document.createElement('div');
    div.className = 'etiquette-item' + (placed ? ' placed' : '');
    div.draggable = !placed;
    div.dataset.id = r.id;

    const ouStr = Array.isArray(r.Ou) ? r.Ou.join(', ') : (r.Ou || '');
    div.innerHTML = `
      <div class="nom">${r.Nom || ''}</div>
      <div class="variete">${r.Variete || ''}</div>
      ${ouStr ? `<div class="ou">📍 ${ouStr}</div>` : ''}
    `;

    if (!placed) {
      div.addEventListener('dragstart', e => {
        draggedId = r.id;
        isDraggingPlaced = false;
        dragOffsetX = 0;
        dragOffsetY = 0;
        e.dataTransfer.effectAllowed = 'move';
      });
    }
    list.appendChild(div);
  });
}

/* =============================================
   DROP
   ============================================= */
function dropOnPlan(event) {
  event.preventDefault();
  if (draggedId === null || isDraggingPlaced) return;
  const svg  = document.getElementById('plan');
  const rect = svg.getBoundingClientRect();
  positions[draggedId] = {
    x: Math.round(event.clientX - rect.left - 40),
    y: Math.round(event.clientY - rect.top - 10)
  };
  draggedId = null;
  renderPanel();
  renderPlacedTags();
}

function dropOnZone(event, zoneName) {
  event.preventDefault();
  event.stopPropagation();
  if (draggedId === null || isDraggingPlaced) return;
  const svg  = document.getElementById('plan');
  const rect = svg.getBoundingClientRect();
  positions[draggedId] = {
    x: Math.round(event.clientX - rect.left - 40),
    y: Math.round(event.clientY - rect.top - 10)
  };
  draggedId = null;
  renderPanel();
  renderPlacedTags();
}

/* =============================================
   ÉTIQUETTES PLACÉES
   ============================================= */
function renderPlacedTags() {
  const container = document.getElementById('placed-tags');
  container.innerHTML = '';

  Object.entries(positions).forEach(([id, pos]) => {
    const r = records.find(x => x.id === parseInt(id));
    if (!r) return;

    const nom     = (r.Nom     || '').substring(0, 14);
    const variete = (r.Variete || '').substring(0, 14);
    const w = Math.max(nom.length, variete.length) * 5.2 + 16;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.classList.add('placed-tag');
    g.dataset.id = id;
    g.setAttribute('transform', `translate(${pos.x},${pos.y})`);

    g.innerHTML = `
      <rect x="0" y="0" width="${w}" height="${variete ? 26 : 16}" rx="3"
            fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
      <text x="4" y="10" font-size="8" font-weight="bold" font-family="Arial" fill="#333">${nom}</text>
      ${variete ? `<text x="4" y="20" font-size="7" font-style="italic" font-family="Arial" fill="#555">${variete}</text>` : ''}
      <text x="${w-9}" y="9" font-size="10" fill="#c62828" font-family="Arial"
            style="cursor:pointer" onclick="removeTag(${id})">×</text>
    `;

    // Drag des étiquettes déjà placées
    g.addEventListener('mousedown', e => {
      if (e.target.tagName === 'text' && e.target.textContent === '×') return;
      draggedId = parseInt(id);
      isDraggingPlaced = true;
      const svg  = document.getElementById('plan');
      const rect = svg.getBoundingClientRect();
      dragOffsetX = e.clientX - rect.left - pos.x;
      dragOffsetY = e.clientY - rect.top  - pos.y;
      e.preventDefault();
    });

    container.appendChild(g);
  });

  // Drag souris sur le plan
  const svg = document.getElementById('plan');
  svg.onmousemove = e => {
    if (!isDraggingPlaced || draggedId === null) return;
    const rect = svg.getBoundingClientRect();
    positions[draggedId] = {
      x: Math.round(e.clientX - rect.left - dragOffsetX),
      y: Math.round(e.clientY - rect.top  - dragOffsetY)
    };
    renderPlacedTags();
  };
  svg.onmouseup = () => {
    if (isDraggingPlaced) { isDraggingPlaced = false; draggedId = null; }
  };
}

function removeTag(id) {
  delete positions[id];
  renderPanel();
  renderPlacedTags();
}

/* =============================================
   SAUVEGARDE
   ============================================= */
async function sauvegarder() {
  document.getElementById('status').textContent = 'Sauvegarde...';
  try {
    const placedIds = Object.keys(positions).map(Number);
    const actions = Object.entries(positions).map(([id, pos]) =>
      ['UpdateRecord','Semis', parseInt(id), { Position_X: pos.x, Position_Y: pos.y }]
    );
    records.forEach(r => {
      if (!placedIds.includes(r.id) && (r.Position_X || r.Position_Y)) {
        actions.push(['UpdateRecord','Semis', r.id, { Position_X: null, Position_Y: null }]);
      }
    });
    await grist.docApi.applyUserActions(actions);
    document.getElementById('status').textContent = '✅ Positions sauvegardées !';
    setTimeout(() => document.getElementById('status').textContent = records.length + ' plantes', 2000);
  } catch(e) {
    document.getElementById('status').textContent = '❌ ' + e.message;
  }
}

function resetPositions() {
  if (!confirm('Réinitialiser toutes les positions ?')) return;
  positions = {};
  renderPanel();
  renderPlacedTags();
}
</script>
</body>
</html>
