<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Arial, sans-serif;
  background: #f0ebe3;
  color: #2c2a27;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* =============================================
   LAYOUT
   ============================================= */
.app {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Panel gauche — liste des étiquettes à placer */
.panel {
  width: 200px;
  min-width: 200px;
  background: #fff8f0;
  border-right: 2px solid #d4c5b0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-title {
  background: #2d6a4f;
  color: white;
  font-size: 11px;
  font-weight: bold;
  padding: 8px 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.panel-filter {
  padding: 6px 8px;
  border-bottom: 1px solid #e0d8cc;
}

.panel-filter input {
  width: 100%;
  padding: 4px 6px;
  border: 1px solid #d4c5b0;
  border-radius: 4px;
  font-size: 11px;
}

.panel-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* Étiquette draggable dans le panel */
.etiquette-item {
  background: #e8f5e9;
  border: 1px solid #a5d6a7;
  border-radius: 6px;
  padding: 5px 8px;
  cursor: grab;
  font-size: 10px;
  line-height: 1.3;
  user-select: none;
  transition: all 0.1s;
}
.etiquette-item:hover { background: #c8e6c9; border-color: #66bb6a; }
.etiquette-item.placed { background: #f0f0f0; border-color: #ccc; color: #999; cursor: default; }
.etiquette-item .nom { font-weight: bold; }
.etiquette-item .variete { font-style: italic; color: #555; }
.etiquette-item .zone { font-size: 9px; color: #2d6a4f; }

/* Zone centrale — le plan */
.plan-container {
  flex: 1;
  overflow: auto;
  padding: 16px;
  position: relative;
}

svg#plan {
  background: #f5f0e8;
  border-radius: 8px;
  border: 1px solid #d4c5b0;
  cursor: default;
}

/* Zones du plan */
.zone {
  cursor: pointer;
  transition: opacity 0.15s;
}
.zone:hover { opacity: 0.85; }
.zone.active { stroke-width: 3 !important; stroke: #2d6a4f !important; }
.zone.drag-over { opacity: 0.7; }

/* Étiquettes placées sur le plan */
.placed-tag {
  cursor: move;
  filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.3));
}
.placed-tag rect {
  fill: #fff9c4;
  stroke: #f9a825;
  stroke-width: 1;
  rx: 3;
}
.placed-tag text {
  font-size: 8px;
  fill: #333;
  font-family: Arial, sans-serif;
}

/* Bouton reset */
.toolbar {
  background: #fff8f0;
  border-bottom: 1px solid #d4c5b0;
  padding: 6px 10px;
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 11px;
}
.btn {
  padding: 4px 10px;
  border: 1px solid #d4c5b0;
  border-radius: 4px;
  background: white;
  cursor: pointer;
  font-size: 11px;
}
.btn:hover { background: #f0ebe3; }
.btn-primary { background: #2d6a4f; color: white; border-color: #2d6a4f; }
.btn-primary:hover { background: #1f4f38; }

.status { color: #666; flex: 1; }
</style>
</head>
<body>

<script>
/* =============================================
   DONNÉES
   ============================================= */
let records = [];           // enregistrements Semis
let positions = {};         // id → {x, y} positions sur le plan
let draggedId = null;       // id de l'élément en cours de drag
let dragOffsetX = 0;
let dragOffsetY = 0;
let isDraggingPlaced = false;

/* =============================================
   INITIALISATION GRIST
   ============================================= */
grist.ready({ requiredAccess: 'full' });

grist.onRecords(function(recs) {
  records = recs.filter(r => r.Plantes > 0 || r.A_produire);
  
  // Charger les positions sauvegardées
  records.forEach(r => {
    if (r.Position_X && r.Position_Y) {
      positions[r.id] = { x: r.Position_X, y: r.Position_Y };
    }
  });

  document.getElementById('status').textContent = records.length + ' plantes à placer';
  renderPanel();
  renderPlacedTags();
});

/* =============================================
   PANEL — liste des étiquettes
   ============================================= */
function renderPanel() {
  const list = document.getElementById('panel-list');
  const search = document.getElementById('search').value.toLowerCase();
  list.innerHTML = '';

  records
    .filter(r => {
      const nom = ((r.Nom || '') + ' ' + (r.Variete || '')).toLowerCase();
      return nom.includes(search);
    })
    .forEach(r => {
      const placed = positions[r.id] !== undefined;
      const div = document.createElement('div');
      div.className = 'etiquette-item' + (placed ? ' placed' : '');
      div.draggable = !placed;
      div.dataset.id = r.id;

      const zone = r.Ou ? (Array.isArray(r.Ou) ? r.Ou.join(', ') : r.Ou) : '';
      div.innerHTML = `
        <div class="nom">${r.Nom || ''}</div>
        <div class="variete">${r.Variete || ''}</div>
        ${zone ? `<div class="zone">📍 ${zone}</div>` : ''}
      `;

      if (!placed) {
        div.addEventListener('dragstart', e => {
          draggedId = r.id;
          isDraggingPlaced = false;
          e.dataTransfer.effectAllowed = 'move';
        });
      }

      list.appendChild(div);
    });
}

function filtrerEtiquettes() {
  renderPanel();
}

/* =============================================
   DROP SUR LE PLAN
   ============================================= */
function dropOnPlan(event) {
  event.preventDefault();
  if (draggedId === null) return;

  const svg = document.getElementById('plan');
  const rect = svg.getBoundingClientRect();
  const x = Math.round(event.clientX - rect.left - dragOffsetX);
  const y = Math.round(event.clientY - rect.top - dragOffsetY);

  positions[draggedId] = { x, y };
  draggedId = null;
  renderPanel();
  renderPlacedTags();
}

function dropOnZone(event, zoneName) {
  event.preventDefault();
  event.stopPropagation();
  if (draggedId === null) return;

  const svg = document.getElementById('plan');
  const rect = svg.getBoundingClientRect();
  const x = Math.round(event.clientX - rect.left);
  const y = Math.round(event.clientY - rect.top);

  positions[draggedId] = { x, y };
  draggedId = null;

  document.querySelectorAll('.zone').forEach(z => z.classList.remove('drag-over'));
  renderPanel();
  renderPlacedTags();
}

function dragOverZone(event, el) {
  event.preventDefault();
  document.querySelectorAll('.zone').forEach(z => z.classList.remove('drag-over'));
  el.classList.add('drag-over');
}

/* =============================================
   ÉTIQUETTES PLACÉES SUR LE PLAN
   ============================================= */
function renderPlacedTags() {
  const container = document.getElementById('placed-tags');
  container.innerHTML = '';

  Object.entries(positions).forEach(([id, pos]) => {
    const r = records.find(x => x.id === parseInt(id));
    if (!r) return;

    const nom = (r.Nom || '').substring(0, 12);
    const variete = (r.Variete || '').substring(0, 12);
    const w = Math.max(nom.length, variete.length) * 5.5 + 10;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.classList.add('placed-tag');
    g.dataset.id = id;
    g.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);

    g.innerHTML = `
      <rect x="0" y="0" width="${w}" height="${variete ? 28 : 18}" rx="3"/>
      <text x="4" y="11" font-size="8" font-weight="bold">${nom}</text>
      ${variete ? `<text x="4" y="22" font-size="7" font-style="italic">${variete}</text>` : ''}
      <text x="${w - 10}" y="9" font-size="9" fill="#c62828" style="cursor:pointer" 
            onclick="removeTag(${id})">×</text>
    `;

    /* Drag des étiquettes déjà placées */
    g.addEventListener('mousedown', e => {
      draggedId = parseInt(id);
      isDraggingPlaced = true;
      const svg = document.getElementById('plan');
      const rect = svg.getBoundingClientRect();
      dragOffsetX = e.clientX - rect.left - pos.x;
      dragOffsetY = e.clientY - rect.top - pos.y;
      e.preventDefault();
    });

    container.appendChild(g);
  });

  /* Drag des étiquettes placées avec la souris */
  const svg = document.getElementById('plan');
  svg.onmousemove = e => {
    if (!isDraggingPlaced || draggedId === null) return;
    const rect = svg.getBoundingClientRect();
    const x = Math.round(e.clientX - rect.left - dragOffsetX);
    const y = Math.round(e.clientY - rect.top - dragOffsetY);
    positions[draggedId] = { x, y };
    renderPlacedTags();
  };

  svg.onmouseup = () => {
    if (isDraggingPlaced) {
      isDraggingPlaced = false;
      draggedId = null;
    }
  };
}

function removeTag(id) {
  delete positions[id];
  renderPanel();
  renderPlacedTags();
}

/* =============================================
   SAUVEGARDE DANS GRIST
   ============================================= */
async function sauvegarder() {
  document.getElementById('status').textContent = 'Sauvegarde...';
  try {
    const actions = Object.entries(positions).map(([id, pos]) => [
      'UpdateRecord', 'Semis', parseInt(id), {
        Position_X: pos.x,
        Position_Y: pos.y
      }
    ]);

    // Remettre à zéro les positions des étiquettes retirées
    const placedIds = Object.keys(positions).map(Number);
    records.forEach(r => {
      if (!placedIds.includes(r.id) && (r.Position_X || r.Position_Y)) {
        actions.push(['UpdateRecord', 'Semis', r.id, { Position_X: null, Position_Y: null }]);
      }
    });

    await grist.docApi.applyUserActions(actions);
    document.getElementById('status').textContent = '✅ Positions sauvegardées !';
    setTimeout(() => {
      document.getElementById('status').textContent = records.length + ' plantes';
    }, 2000);
  } catch(e) {
    document.getElementById('status').textContent = '❌ Erreur : ' + e.message;
  }
}

function resetPositions() {
  positions = {};
  renderPanel();
  renderPlacedTags();
}
</script>
